apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  k3s-io.server: |
    k3s.io:53 {
        errors
        cache 300
        forward . ${ADGUARD_IP} 1.1.1.1
    }
  authentik-public.server: |
    authentik.${PUBLIC_DOMAIN}:53 {
        errors
        cache 30
        forward . 1.1.1.1 1.0.0.1
    }
