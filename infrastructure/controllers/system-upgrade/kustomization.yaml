apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crd.yaml
  - system-upgrade-controller.yaml
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: system-upgrade
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: default-controller-env
        namespace: system-upgrade
      data:
        SYSTEM_UPGRADE_CONTROLLER_LEADER_ELECT: "false"
