apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik-public-tls
  namespace: authentik
spec:
  secretName: authentik-public-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "authentik.${PUBLIC_DOMAIN}"
  dnsNames:
    - "authentik.${PUBLIC_DOMAIN}"
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
