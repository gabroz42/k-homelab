apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  type: alertmanager
  address: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093/api/v2/alerts/
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: flux-errors
  namespace: flux-system
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    - kind: Kustomization
      name: '*'
    - kind: GitRepository
      name: '*'
    - kind: HelmRepository
      name: '*'
    - kind: OCIRepository
      name: '*'
    - kind: HelmChart
      name: '*'
    - kind: HelmRelease
      name: '*'
      namespace: authentik
    - kind: HelmRelease
      name: '*'
      namespace: cert-manager
    - kind: HelmRelease
      name: '*'
      namespace: cnpg-system
    - kind: HelmRelease
      name: '*'
      namespace: external-secrets
    - kind: HelmRelease
      name: '*'
      namespace: gitlab-runner
    - kind: HelmRelease
      name: '*'
      namespace: jellyfin
    - kind: HelmRelease
      name: '*'
      namespace: kube-system
    - kind: HelmRelease
      name: '*'
      namespace: kyverno
    - kind: HelmRelease
      name: '*'
      namespace: metallb-system
    - kind: HelmRelease
      name: '*'
      namespace: minio
    - kind: HelmRelease
      name: '*'
      namespace: monitoring
    - kind: HelmRelease
      name: '*'
      namespace: nextcloud
    - kind: HelmRelease
      name: '*'
      namespace: renovate
    - kind: HelmRelease
      name: '*'
      namespace: volsync-system
