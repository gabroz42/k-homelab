apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: disk-health-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: disk-health.rules
      rules:
        - alert: DiskSmartFailed
          expr: max by (device) (smartctl_device_smart_status) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Disk {{ $labels.device }} failed its SMART health check"
            description: >
              The drive's own self-assessment reports FAILED. Expect it to die soon:
              check the Backups dashboard for a recent snapshot and plan a replacement.
        - alert: NvmeCriticalWarning
          expr: max by (device) (smartctl_device_critical_warning) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} raised a critical warning ({{ $value }})"
            description: >
              The NVMe critical-warning bitmask is non-zero (spare below threshold,
              over temperature, reliability degraded, read-only, or volatile backup
              failed). Run `sudo smartctl -a /dev/disk/by-id/{{ $labels.device }}`.
        - alert: NvmeSpareLow
          expr: >
            max by (device) (smartctl_device_available_spare)
            <= on (device) max by (device) (smartctl_device_available_spare_threshold)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} has run out of spare blocks"
            description: >
              Available spare is at or below the vendor threshold, so the drive can no
              longer remap worn cells and will soon go read-only.
        - alert: NvmeMediaErrors
          expr: max by (device) (increase(smartctl_device_media_errors[1d])) > 0
          labels:
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} logged new media errors"
            description: >
              Unrecovered data-integrity errors grew by {{ $value }} in the last 24h.
              A healthy drive stays at 0. Check `journalctl -k | grep nvme`.
        - alert: NvmeWearHigh
          expr: max by (device) (smartctl_device_percentage_used) >= 90
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} is {{ $value }}% through its rated endurance"
            description: >
              The drive is close to its rated write endurance (TBW). It often keeps
              working well past 100%, but it's time to buy a replacement.
        - alert: NvmeTemperatureHigh
          expr: max by (device) (smartctl_device_temperature{temperature_type="current", device=~"nvme-.*"}) > 70
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} at {{ $value }}°C"
            description: >
              Over 70°C for 10 minutes; the drive will start thermal-throttling soon.
        - alert: HddBadSectorsGrowing
          expr: >
            max by (device, attribute_name) (
              delta(smartctl_device_attribute{attribute_id=~"5|197|198", attribute_value_type="raw"}[8d])
            ) > 0
          labels:
            severity: warning
          annotations:
            summary: "HDD {{ $labels.device }}: {{ $labels.attribute_name }} grew by {{ $value }}"
            description: >
              Reallocated, pending or offline-uncorrectable sector counts went up.
              A rising count is the classic early sign of a failing spinning disk.
        - alert: SmartctlExporterDown
          expr: (min(up{job="smartctl-exporter"}) or vector(0)) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "smartctl-exporter is down"
            description: >
              Disk health metrics are not being collected, so the disk alerts cannot fire.
