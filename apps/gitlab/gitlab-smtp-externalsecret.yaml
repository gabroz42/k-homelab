apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-smtp
  namespace: gitlab
spec:
  refreshInterval: 12h50m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: gitlab-smtp
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: monitoring/alertmanager-email/smtp-username
    - secretKey: password
      remoteRef:
        key: monitoring/alertmanager-email/smtp-password
    - secretKey: from
      remoteRef:
        key: monitoring/alertmanager-email/from
