apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config
  namespace: gitlab
  annotations:
    longhorn.io/number-of-replicas: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
  annotations:
    longhorn.io/number-of-replicas: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 30Gi
---
# Target of `gitlab-backup create` + `gitlab-ctl backup-etc` (apps/gitlab/gitlab-backup-cronjob.yaml);
# VolSync ships this volume, not gitlab-data, to restic (apps/backup/volsync-gitlab.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-backups
  namespace: gitlab
  annotations:
    longhorn.io/number-of-replicas: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
