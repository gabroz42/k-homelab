apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector:
    app: gitlab
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab-external
  namespace: gitlab
spec:
  ingressClassName: traefik
  rules:
    - host: gitlab.${PUBLIC_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port:
                  number: 80
---
# LAN entry (AdGuard rewrite gitlab.${PUBLIC_DOMAIN} -> Traefik): HTTPS terminated by
# Traefik with gitlab-public-tls. The tunnel keeps using gitlab-external over plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab-lan
  namespace: gitlab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gitlab.${PUBLIC_DOMAIN}
      secretName: gitlab-public-tls
  rules:
    - host: gitlab.${PUBLIC_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port:
                  number: 80
