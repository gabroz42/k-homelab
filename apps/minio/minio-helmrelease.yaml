apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 1h
  releaseName: minio
  chart:
    spec:
      chart: minio
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # MinIO stopped publishing images (quay.io answers 401, Docker Hub repos removed in
    # 2026); this is a copy of the last image the node had, in the cluster registry.
    image:
      repository: registry.local.gabro.ovh/mirror/minio
      tag: RELEASE.2024-12-18T13-15-44Z
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: registry-pull
    # One writer on the volume: stop the old pod before starting the new one
    deploymentUpdate:
      type: Recreate
    mode: standalone
    securityContext:
      enabled: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    replicas: 1

    existingSecret: minio-root-credentials

    persistence:
      enabled: true
      size: 500Gi

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi

    service:
      type: ClusterIP
      ports:
        api: 9000
        console: 9001

    consoleService:
      type: ClusterIP

    # The nextcloud bucket and user are made by minio-setup-job.yaml: the chart's
    # post-install job has no securityContext, so Kyverno would deny it.
    users: []

    ingress:
      enabled: false
