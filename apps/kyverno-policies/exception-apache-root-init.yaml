apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: apache-root-init
  namespace: kyverno
spec:
  evaluationMode: Kyverno
  policyRefs:
    - kind: ValidatingPolicy
      name: require-run-as-non-root
  reportResult: skip
  matchConditions:
    - name: nextcloud-apache-prefork
      expression: >-
        object.metadata.namespace == 'nextcloud' &&
        !object.metadata.name.startsWith('nextcloud-db') &&
        !object.metadata.name.startsWith('nextcloud-valkey') &&
        (object.metadata.name == 'nextcloud' || object.metadata.name.startsWith('nextcloud-'))
