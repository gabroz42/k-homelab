apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hardware
  namespace: monitoring
  labels:
    grafana_dashboard: "hardware"
data:
  power-and-temps.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "UPS Status",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "network_ups_tools_ups_status == 1",
              "instant": true,
              "legendFormat": "{{flag}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"options": {"OL": {"color": "green", "index": 0}}, "type": "value"},
                {"options": {"OB": {"color": "red", "index": 1}}, "type": "value"},
                {"options": {"LB": {"color": "red", "index": 2}}, "type": "value"},
                {"options": {"CHRG": {"color": "yellow", "index": 3}}, "type": "value"},
                {"options": {"DISCHRG": {"color": "orange", "index": 4}}, "type": "value"}
              ],
              "color": {"mode": "fixed", "fixedColor": "green"}
            }
          }
        },
        {
          "type": "gauge",
          "title": "UPS Load",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "network_ups_tools_ups_load",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 60},
                  {"color": "orange", "value": 80},
                  {"color": "red", "value": 90}
                ]
              }
            }
          }
        },
        {
          "type": "gauge",
          "title": "Battery Charge",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "network_ups_tools_battery_charge",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "orange", "value": 30},
                  {"color": "yellow", "value": 60},
                  {"color": "green", "value": 80}
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Estimated Power Draw",
          "description": "Approximate W = load% × 1000 VA × 0.6 PF",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "network_ups_tools_ups_load * 6",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 300},
                  {"color": "orange", "value": 450},
                  {"color": "red", "value": 540}
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Estimated Power Draw (W)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 5,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "network_ups_tools_ups_load * 6",
              "legendFormat": "Watts",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {"fillOpacity": 20, "lineWidth": 2, "showPoints": "never"}
            }
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "single"}
          }
        },
        {
          "type": "timeseries",
          "title": "Voltage (V)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 6,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "network_ups_tools_input_voltage",
              "legendFormat": "Input",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "network_ups_tools_output_voltage",
              "legendFormat": "Output",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "network_ups_tools_battery_voltage",
              "legendFormat": "Battery",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "volt",
              "custom": {"fillOpacity": 0, "lineWidth": 2, "showPoints": "never"}
            }
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "type": "timeseries",
          "title": "NVMe Drive Temperatures",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "id": 7,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "label_replace(label_replace(node_hwmon_temp_celsius{chip=~\"nvme.*\"}, \"drive\", \"Samsung 970 EVO\", \"chip\", \"nvme_nvme0\"), \"drive\", \"Sabrent Rocket\", \"chip\", \"nvme_nvme1\")",
              "legendFormat": "{{drive}} {{sensor}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {"fillOpacity": 10, "lineWidth": 2, "showPoints": "never"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 60},
                  {"color": "orange", "value": 70},
                  {"color": "red", "value": 80}
                ]
              }
            }
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "type": "timeseries",
          "title": "HDD Activity (spin-up indicator)",
          "description": "Percent of time each spinning disk is busy. Long flat 0% periods = drive likely spun down. Spikes = spin-ups.",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 20},
          "id": 9,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "(rate(node_disk_io_time_seconds_total[5m]) * 100) * on(instance, device) group_left(model) node_disk_info{model=~\"ST.*|WDC.*|Hitachi.*|HGST.*|TOSHIBA.*\"}",
              "legendFormat": "{{device}} ({{model}})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {
                "fillOpacity": 25,
                "lineWidth": 1,
                "showPoints": "never",
                "drawStyle": "bars",
                "barAlignment": 0
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              }
            }
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "mean", "max"]},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "type": "timeseries",
          "title": "CPU & Motherboard Temperatures",
          "description": "Server (AMD k10temp) and Pi5 (SoC thermal zone) CPU temps, plus connected NCT6775 motherboard channels. Disconnected/phantom NCT6775 inputs are filtered out.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "id": 8,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "node_hwmon_temp_celsius{chip=\"pci0000:00_0000:00:18_3\"}",
              "legendFormat": "Server CPU",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "node_hwmon_temp_celsius{chip=\"thermal_thermal_zone0\", sensor=\"temp0\"}",
              "legendFormat": "Pi5 CPU",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "node_hwmon_temp_celsius{chip=\"1000120000_pcie_1f000c8000_adc\"}",
              "legendFormat": "Pi5 PCIe",
              "refId": "C"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "node_hwmon_temp_celsius{chip=~\"platform_nct6775.*\", sensor=~\"temp2|temp3|temp7|temp13\"}",
              "legendFormat": "Server mobo {{sensor}}",
              "refId": "D"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {"fillOpacity": 0, "lineWidth": 2, "showPoints": "never"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 70},
                  {"color": "orange", "value": 85},
                  {"color": "red", "value": 95}
                ]
              }
            }
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "type": "row",
          "title": "Fans",
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 28},
          "id": 10,
          "panels": []
        },
        {
          "type": "xychart",
          "title": "Fan Curves (duty vs control temperature, last 7d)",
          "description": "Observed fan curves: each point is one 5-minute sample of a fan's PWM duty plotted against the temperature pankha controls on (highest visible sensor: k10temp Tctl, NVMe, connected NCT6793 channels; phantom inputs excluded). All fans use pankha's 'Optimal' profile, edited in the pankha UI.",
          "gridPos": {"h": 12, "w": 12, "x": 0, "y": 29},
          "id": 11,
          "timeFrom": "7d",
          "interval": "5m",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "max(node_hwmon_temp_celsius{chip=~\"nvme_.*|pci0000:00_0000:00:18_3\"} or node_hwmon_temp_celsius{chip=~\"platform_nct6775.*\", sensor=~\"temp2|temp3|temp7|temp13\"})",
              "legendFormat": "Control temp",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "label_replace(node_hwmon_pwm{chip=~\"platform_nct6775.*\"} / 2.55, \"fan\", \"Fan $1\", \"sensor\", \"pwm(\\\\d+)\")",
              "legendFormat": "{{fan}}",
              "refId": "B"
            }
          ],
          "transformations": [
            {"id": "joinByField", "options": {"byField": "Time", "mode": "inner"}}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {"show": "points", "pointSize": {"fixed": 4}, "fillOpacity": 50}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Control temp"},
                "properties": [
                  {"id": "unit", "value": "celsius"},
                  {"id": "min", "value": 20},
                  {"id": "max", "value": 90}
                ]
              }
            ]
          },
          "options": {
            "mapping": "auto",
            "series": [{}],
            "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "single"}
          }
        },
        {
          "type": "timeseries",
          "title": "Fan Duty (%)",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 29},
          "id": 12,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "label_replace(node_hwmon_pwm{chip=~\"platform_nct6775.*\"} / 2.55, \"fan\", \"Fan $1\", \"sensor\", \"pwm(\\\\d+)\")",
              "legendFormat": "{{fan}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {"fillOpacity": 0, "lineWidth": 2, "showPoints": "never"}
            }
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "type": "timeseries",
          "title": "Fan Speed (RPM)",
          "description": "Fans 3-5 have no tachometer signal and always read 0 RPM.",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 35},
          "id": 13,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "label_replace(node_hwmon_fan_rpm{chip=~\"platform_nct6775.*\"}, \"fan\", \"Fan $1\", \"sensor\", \"fan(\\\\d+)\")",
              "legendFormat": "{{fan}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "rotrpm",
              "min": 0,
              "custom": {"fillOpacity": 0, "lineWidth": 2, "showPoints": "never"}
            }
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "type": "row",
          "title": "Disk Health",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 41
          },
          "id": 14,
          "panels": []
        },
        {
          "type": "table",
          "title": "Drive Health (SMART)",
          "id": 15,
          "description": "HDDs are read once per spin-up (the exporter never wakes a sleeping disk), so their values can be up to a week old. Wear, spare and media errors are NVMe-only; reallocated/pending sectors are HDD-only.",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 42
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (device, model_name, serial_number, firmware_version) (smartctl_device)",
              "refId": "A",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (device) (smartctl_device_smart_status)",
              "refId": "B",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (device) (smartctl_device_temperature{temperature_type=\"current\"})",
              "refId": "C",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (device) (smartctl_device_power_on_seconds)",
              "refId": "D",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (device) (smartctl_device_percentage_used)",
              "refId": "E",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (device) (smartctl_device_available_spare)",
              "refId": "F",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (device) (smartctl_device_media_errors)",
              "refId": "G",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (device) (smartctl_device_attribute{attribute_id=\"5\", attribute_value_type=\"raw\"})",
              "refId": "H",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (device) (smartctl_device_attribute{attribute_id=\"197\", attribute_value_type=\"raw\"})",
              "refId": "I",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (device) (smartctl_device_bytes_written)",
              "refId": "J",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (device) (smartctl_device_power_cycle_count)",
              "refId": "K",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value #A": true
                },
                "indexByName": {
                  "device": 0,
                  "model_name": 1,
                  "serial_number": 2,
                  "firmware_version": 3,
                  "Value #B": 4,
                  "Value #C": 5,
                  "Value #E": 6,
                  "Value #F": 7,
                  "Value #G": 8,
                  "Value #H": 9,
                  "Value #I": 10,
                  "Value #J": 11,
                  "Value #D": 12,
                  "Value #K": 13
                },
                "renameByName": {
                  "device": "Device",
                  "model_name": "Model",
                  "serial_number": "Serial",
                  "firmware_version": "Firmware",
                  "Value #B": "SMART",
                  "Value #C": "Temp",
                  "Value #D": "Power-on",
                  "Value #E": "Wear used",
                  "Value #F": "Spare",
                  "Value #G": "Media errors",
                  "Value #H": "Reallocated",
                  "Value #I": "Pending",
                  "Value #J": "Written",
                  "Value #K": "Power cycles"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": false
              },
              "noValue": "–"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "SMART"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "FAILED",
                            "color": "red",
                            "index": 0
                          },
                          "1": {
                            "text": "PASSED",
                            "color": "green",
                            "index": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Temp"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 50
                        },
                        {
                          "color": "red",
                          "value": 65
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Wear used"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 70
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Spare"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 20
                        },
                        {
                          "color": "green",
                          "value": 50
                        }
                      ]
                    }
                  }
                ]
              },
              {
