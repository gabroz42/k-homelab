apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
  namespace: renovate
spec:
  refreshInterval: 13h20m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: renovate
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        RENOVATE_HOST_RULES: '[{"matchHost":"ghcr.io","hostType":"docker","username":"gabroz42","password":"{{ .RENOVATE_GITHUB_COM_TOKEN }}"},{"matchHost":"lscr.io","hostType":"docker","username":"gabroz42","password":"{{ .RENOVATE_GITHUB_COM_TOKEN }}"}]'
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: renovate/renovate/gitlab-token
    - secretKey: RENOVATE_GITHUB_COM_TOKEN
      remoteRef:
        key: renovate/renovate/github-com-token
