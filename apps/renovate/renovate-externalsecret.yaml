apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
  namespace: renovate
spec:
  refreshInterval: 13h20m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: renovate
    creationPolicy: Owner
  data:
    # GitLab project access token (bot user, Developer, api + write_repository)
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: renovate/renovate/gitlab-token
