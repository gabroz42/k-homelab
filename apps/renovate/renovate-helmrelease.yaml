apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 1h
  releaseName: renovate
  chart:
    spec:
      chart: renovate
      version: "46.382.1"
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    cronjob:
      schedule: "0 * * * *"
      timeZone: ${TIMEZONE}
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 2
      jobBackoffLimit: "0"
      activeDeadlineSeconds: 3600
    existingSecret: renovate
    renovate:
      config: |
        {
          "platform": "gitlab",
          "endpoint": "http://gitlab.gitlab.svc.cluster.local/api/v4",
          "gitUrl": "endpoint",
          "autodiscover": false,
          "repositories": ["server/k-homelab"],
          "onboarding": false,
          "requireConfig": "required",
          "gitAuthor": "Renovate Bot <renovate-bot@${PUBLIC_DOMAIN}>",
          "cachePrivatePackages": true,
          "cacheTtlOverride": {
            "datasource-docker-tags": 360,
            "datasource-releases-docker": 360
          }
        }
      persistence:
        cache:
          enabled: true
          storageSize: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    securityContext:
      runAsNonRoot: true
      runAsUser: 12021
      runAsGroup: 0
      fsGroup: 12021
      seccompProfile:
        type: RuntimeDefault
    pod:
      labels:
        app: renovate
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
