# Centralino (ESP32 home-automation panel). The page lives in its own repo,
# server/centralino (centralino.html); nginx config and manifests stay here in
# apps/centralino. Flux merges the two (GitRepository include) and fills
# ${ESP32_*_IP} / ${PUBLIC_DOMAIN} from cluster-settings. The egress policy is in
# infrastructure/configs/network-policies/centralino.
---
# Bitwarden: deploy token of server/centralino (scope read_repository)
#   flux-system/centralino-git/username  the token's username (GitLab rejects any other)
#   flux-system/centralino-git/token     the token
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: centralino-git
  namespace: flux-system
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: centralino-git
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef:
        key: flux-system/centralino-git/username
    - secretKey: token
      remoteRef:
        key: flux-system/centralino-git/token
---
# The page: server/centralino (centralino.html + README.md)
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: centralino-page
  namespace: flux-system
spec:
  interval: 5m
  timeout: 60s
  ref:
    branch: main
  url: http://gitlab.gitlab.svc.cluster.local/server/centralino.git
  secretRef:
    name: centralino-git
---
# This repo again, with the page copied into apps/centralino/site/. The Kustomization
# below builds from this source, so a push to either repo redeploys centralino.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: centralino
  namespace: flux-system
spec:
  interval: 5m
  timeout: 60s
  ref:
    branch: main
  url: http://gitlab.gitlab.svc.cluster.local/server/k-homelab.git
  secretRef:
    name: flux-system-git
  include:
    - repository:
        name: centralino-page
      toPath: apps/centralino/site
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: centralino
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: centralino
  path: ./apps/centralino
  prune: true
  wait: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
