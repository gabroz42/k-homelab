apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 13h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            smtp_smarthost: in-v3.mailjet.com:587
            smtp_require_tls: true
            smtp_from: {{ .from | quote }}
            smtp_auth_username: {{ .smtpUsername | quote }}
            smtp_auth_password: {{ .smtpPassword | quote }}
          route:
            receiver: "null"
            group_by: ["severity"]
            group_wait: 1m
            group_interval: 30m
            repeat_interval: 24h
            routes:
              - matchers: ['alertname = "Watchdog"']
                receiver: "null"
              - matchers: ['alertname = "InfoInhibitor"']
                receiver: "null"
              - matchers: ['severity = "critical"']
                receiver: email
                repeat_interval: 6h
              - matchers: ['severity = "warning"']
                receiver: email
                repeat_interval: 24h
          inhibit_rules:
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity =~ "warning|info"']
              equal: ["namespace", "alertname"]
            - source_matchers: ['severity = "warning"']
              target_matchers: ['severity = "info"']
              equal: ["namespace", "alertname"]
            - source_matchers: ['alertname = "InfoInhibitor"']
              target_matchers: ['severity = "info"']
              equal: ["namespace"]
            - target_matchers: ['alertname = "InfoInhibitor"']
          receivers:
            - name: "null"
            - name: email
              email_configs:
                - to: {{ .to | quote }}
                  send_resolved: true
  data:
    - secretKey: smtpUsername
      remoteRef:
        key: monitoring/alertmanager-email/smtp-username
    - secretKey: smtpPassword
      remoteRef:
        key: monitoring/alertmanager-email/smtp-password
    - secretKey: from
      remoteRef:
        key: monitoring/alertmanager-email/from
    - secretKey: to
      remoteRef:
        key: monitoring/alertmanager-email/to
