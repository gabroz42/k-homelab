apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
spec:
  interval: 1h
  releaseName: gitlab-runner
  chart:
    spec:
      chart: gitlab-runner
      version: "0.94.1"
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    gitlabUrl: http://gitlab.gitlab.svc.cluster.local/
    concurrent: 2
    checkInterval: 10
    rbac:
      create: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 100
      fsGroup: 65533
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    runners:
      secret: gitlab-runner
      config: |
        [[runners]]
          request_concurrency = 2
          clone_url = "http://gitlab.gitlab.svc.cluster.local"
          environment = ["HOME=/tmp"]
          [runners.feature_flags]
            FF_USE_ADVANCED_POD_SPEC_CONFIGURATION = true
          [runners.kubernetes]
            namespace = "{{ .Release.Namespace }}"
            image = "alpine:3.22"
            cpu_request = "100m"
            memory_request = "128Mi"
            memory_limit = "1Gi"
            memory_request_overwrite_max_allowed = "2Gi"
            memory_limit_overwrite_max_allowed = "4Gi"
            helper_cpu_request = "20m"
            helper_memory_request = "64Mi"
            helper_memory_limit = "256Mi"
            [runners.kubernetes.pod_labels]
              app = "gitlab-runner-job"
            [runners.kubernetes.pod_security_context]
              run_as_non_root = true
              run_as_user = 1000
              run_as_group = 1000
              fs_group = 1000
            [runners.kubernetes.build_container_security_context]
              allow_privilege_escalation = false
              [runners.kubernetes.build_container_security_context.capabilities]
                drop = ["ALL"]
            [runners.kubernetes.helper_container_security_context]
              allow_privilege_escalation = false
              [runners.kubernetes.helper_container_security_context.capabilities]
                drop = ["ALL"]
            [runners.kubernetes.init_permissions_container_security_context]
              allow_privilege_escalation = false
              [runners.kubernetes.init_permissions_container_security_context.capabilities]
                drop = ["ALL"]
            # CI `services:` (e.g. postgres) — without this Kyverno rejects the job pod
            [runners.kubernetes.service_container_security_context]
              allow_privilege_escalation = false
              [runners.kubernetes.service_container_security_context.capabilities]
                drop = ["ALL"]
            [[runners.kubernetes.pod_spec]]
              name = "seccomp-runtime-default"
              patch_type = "strategic"
              patch = '''
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
              '''
