# Bitwarden: credentials of the runner cache MinIO (runner-cache-helmrelease.yaml).
#   gitlab-runner/runner-cache/access-key   any user name, e.g. gitlab-runner-cache
#   gitlab-runner/runner-cache/secret-key   random, 32+ chars (openssl rand -hex 32)
# The same pair is MinIO's root user and the runner's S3 credentials: this MinIO holds
# nothing but the cache, and only the runner manager sees the keys (job pods get
# presigned URLs).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runner-cache-root
  namespace: gitlab-runner
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: runner-cache-root
    creationPolicy: Owner
  data:
    - secretKey: rootUser
      remoteRef:
        key: gitlab-runner/runner-cache/access-key
    - secretKey: rootPassword
      remoteRef:
        key: gitlab-runner/runner-cache/secret-key
---
# Same keys in the shape the gitlab-runner chart expects (runners.cache.secretName)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runner-cache-s3
  namespace: gitlab-runner
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: runner-cache-s3
    creationPolicy: Owner
  data:
    - secretKey: accesskey
      remoteRef:
        key: gitlab-runner/runner-cache/access-key
    - secretKey: secretkey
      remoteRef:
        key: gitlab-runner/runner-cache/secret-key
