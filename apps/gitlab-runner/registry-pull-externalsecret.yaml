# Pull secret for registry.local.gabro.ovh (the mirrored MinIO image). The registry is
# shared cluster infrastructure (work/infra/gitops platform/registry), so this reuses its
# existing pull credential: store bitwarden-work, registry/registry-pull/dockerconfigjson.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-pull
  namespace: gitlab-runner
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-work
  target:
    name: registry-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: "{{ .config }}"
  data:
    - secretKey: config
      remoteRef:
        key: registry/registry-pull/dockerconfigjson
