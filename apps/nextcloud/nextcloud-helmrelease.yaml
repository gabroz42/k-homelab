apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 1h
  releaseName: nextcloud
  chart:
    spec:
      chart: nextcloud
      version: "9.4.1"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    nextcloud:
      podSecurityContext:
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
            - DAC_OVERRIDE
            - SETGID
            - SETUID
      host: nextcloud.${PUBLIC_DOMAIN}
      username: gabro
      existingSecret:
        enabled: true
        secretName: nextcloud-secrets
        usernameKey: NEXTCLOUD_ADMIN_USER
        passwordKey: NEXTCLOUD_ADMIN_PASSWORD
      trustedDomains:
        - nextcloud.${PUBLIC_DOMAIN}
        - nextcloud.${LOCAL_DOMAIN}
        - localhost
      extraEnv:
        - name: OVERWRITEPROTOCOL
          value: https
        - name: OVERWRITECLIURL
          value: https://nextcloud.${PUBLIC_DOMAIN}
        - name: TRUSTED_PROXIES
          value: "${POD_CIDR} 10.43.0.0/16"
        - name: PHP_MEMORY_LIMIT
          value: "1024M"
        - name: PHP_UPLOAD_LIMIT
          value: "150G"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: nextcloud-s3
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nextcloud-s3
              key: S3_SECRET_KEY
      defaultConfigs:
        s3.config.php: false
        swift.config.php: false
      configs:
        objectstore.config.php: |-
          <?php
          $CONFIG = [
            'objectstore' => [
              'class' => '\\OC\\Files\\ObjectStore\\S3',
              'arguments' => [
                'bucket' => 'nextcloud',
                'autocreate' => true,
                'key' => getenv('S3_ACCESS_KEY'),
                'secret' => getenv('S3_SECRET_KEY'),
                'hostname' => 'minio.minio.svc.cluster.local',
                'port' => 9000,
                'use_ssl' => false,
                'region' => 'us-east-1',
                'use_path_style' => true,
              ],
            ],
          ];
        extra.config.php: |-
          <?php
          $CONFIG = [
            'maintenance_window_start' => 1,
            'default_phone_region' => 'IT',
            'serverid' => 1,
          ];
    startupProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 60
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
    cronjob:
      enabled: false
    persistence:
      enabled: true
      size: 50Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn
    internalDatabase:
      enabled: false
    postgresql:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: nextcloud-db
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-db
        usernameKey: db-username
        passwordKey: db-password
    redis:
      enabled: false
    externalRedis:
      enabled: true
      host: nextcloud-valkey
      port: "6379"
      existingSecret:
        enabled: true
        secretName: nextcloud-valkey
        passwordKey: redis-password
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: nextcloud.${PUBLIC_DOMAIN}
          paths:
            - /
