apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-system-git
  namespace: flux-system
spec:
  refreshInterval: 11h50m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: flux-system-git
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: flux
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: flux-system/flux-system-git/token
