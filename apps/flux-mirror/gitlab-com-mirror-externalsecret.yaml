apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-com-mirror
  namespace: flux-system
spec:
  refreshInterval: 12h40m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: gitlab-com-mirror
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: flux
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: flux-system/gitlab-com-mirror/token
