# Ported from .github/workflows/{kubeconform,flate}.yaml.
# Runs on pushes to main and on merge requests targeting main that touch the Flux tree.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
      changes: &flux_tree
        - apps/**/*
        - infrastructure/**/*
        - clusters/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes: *flux_tree
    - if: $CI_PIPELINE_SOURCE == "web"

# Jobs run as uid 1000 with no capabilities (Kyverno), so tools go into a
# job-local bin dir instead of /usr/local/bin, and nothing uses apk.
variables:
  HOME: /tmp
  TOOLS_BIN: /tmp/bin

default:
  interruptible: true

kubeconform:
  image: alpine/k8s:1.37.1
  variables:
    KUBECONFORM_VERSION: v0.6.7
  before_script:
    - mkdir -p "$TOOLS_BIN" && export PATH="$TOOLS_BIN:$PATH"
    - curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$TOOLS_BIN" kubeconform
    - kubeconform -v
  script:
    - |
      set -eu
      fail=0
      for d in clusters/homelab infrastructure/configs infrastructure/controllers apps/*/; do
        d="${d%/}"
        [ -f "$d/kustomization.yaml" ] || continue
        echo "== $d"
        if ! kubectl kustomize "$d" | kubeconform -strict -ignore-missing-schemas -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'; then
          fail=1
        fi
      done
      exit $fail

.flate:
  image: alpine/k8s:1.37.1
  variables:
    FLATE_VERSION: "0.6.5"
    # sha256 of flate_${FLATE_VERSION}_linux_amd64.tar.gz; bump together with the version
    FLATE_SHA256: 37eb0cd91a6752340754375743aa616c263cd8367ce594abd42ee955e1ec0099
  before_script:
    - |
      set -eu
      mkdir -p "$TOOLS_BIN"
      export PATH="$TOOLS_BIN:$PATH"
      tarball="flate_${FLATE_VERSION}_linux_amd64.tar.gz"
      base="https://github.com/home-operations/flate/releases/download/v${FLATE_VERSION}"
      cd /tmp
      curl -fsSLO "$base/$tarball"
      echo "$FLATE_SHA256  $tarball" | sha256sum -c -
      tar -xzf "$tarball" -C "$TOOLS_BIN" flate
      cd "$CI_PROJECT_DIR"
      flate --version

flate:
  extends: .flate
  script:
    - flate test all --path .

flate-diff:
  extends: .flate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - flate diff all --path . --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" | tee flate-diff.txt
  artifacts:
    expose_as: flate diff
    paths:
      - flate-diff.txt
    expire_in: 2 weeks
